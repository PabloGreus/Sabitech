name: sabiteck-despliegue

services:
  frontend:
    build: .
    ports:
      - "127.0.0.1:5173:80"
    volumes:
      - ./app:/var/www/html
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: sabitech
      MYSQL_USER: admin
      MYSQL_PASSWORD: sa_aodbvfe-tech_ñ@
      MYSQL_ROOT_PASSWORD: wqdopgihqnwpigdnqwirgÇ@ñÑ
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      - db
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:8081:80"

volumes:
  mysql_data:
